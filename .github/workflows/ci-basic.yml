name: CI Básico

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validar composição Docker
        run: docker compose config

      - name: Verificar sintaxe Python
        run: |
          if find . -name "*.py" | grep -q .; then
            python -m compileall .
          else
            echo "Nenhum arquivo Python encontrado; pulando verificação de sintaxe."
          fi

      - name: Executar lint com Ruff
        run: ruff check .

      - name: Executar testes automatizados
        run: pytest -q

      - name: Construir imagens Docker dos serviços
        run: |
          for service in api-gateway ingestion-service risk-scoring-service quarantine-service admin-panel-service; do
            echo "Construindo $service..."
            docker build -t "${service}:ci" "$service"
          done
